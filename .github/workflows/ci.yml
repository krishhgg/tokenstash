name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  # A fast follow-up push on a PR supersedes the run; on main every commit keeps its status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Linux and macOS: the shipped platforms. The macOS-only code (apple-native keyring,
    # birth-time fingerprints) must compile on every PR, not for the first time in the release run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      # The black-box one: a real binary, a real inbox, a canary that must not appear
      # anywhere but the project's env file. It runs against the release binary (passed
      # explicitly: the script's default is the debug build `cargo test` leaves behind) with
      # its own HOME so nothing touches the runner's keyring. Linux only: the script is bash
      # plus GNU tools.
      - if: runner.os == 'Linux'
        run: cargo build --release --locked -p tokenstash
      - if: runner.os == 'Linux'
        run: scripts/leak-test.sh target/release/tokenstash
      # The npm release script against a mock registry and a fake `npm`: the launcher is
      # published only after every platform package is served, and a served package that
      # is not ours stops the release. No network, no real publish.
      - if: runner.os == 'Linux'
        run: scripts/npm-package-test.sh
  musl:
    # The Linux artifact is static musl. Build it here so a dependency that stops linking
    # under musl fails a PR, not the release run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --locked --target x86_64-unknown-linux-musl -p tokenstash
        env: { CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc }
