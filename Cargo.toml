[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krishhgg/tokenstash"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "5"
regex = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
zeroize = "1"
secrecy = "0.10"
