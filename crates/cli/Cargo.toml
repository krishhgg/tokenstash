[package]
name = "tokenstash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["api-keys", "secrets", "agents", "mcp", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
description = "Credential broker for coding agents: paste a key once, approve each directory, keep secrets out of status output."

[[bin]]
name = "tokenstash"
path = "src/main.rs"

[dependencies]
tokenstash-core = { path = "../core", version = "0.4.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
rpassword = "7"
open = "5"
urlencoding = "2"
rand.workspace = true
# Already in the lock file (keyring pulls them in); declared directly for the inbox
# session token, the /verify HMAC, and constant-time credential comparison.
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
secrecy.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true
regex.workspace = true
